# CIRCE Intel Desk — configuração do Alembic.
#
# Sprint 01 — Bloco 3.
#
# A URL do SQLAlchemy é INTENCIONALMENTE deixada vazia aqui. O env.py
# injeta DATABASE_URL importando de app.database.session, que por sua vez
# lê de app.config.settings. Isso preserva portabilidade entre máquinas
# (DATA_DIR pode variar) e centraliza a configuração em um só lugar.

[alembic]
# Caminho dos scripts de migração (gerado pelo `alembic init`).
script_location = app/database/migrations

# Template do nome de arquivo de migração. Inclui data e slug para
# facilitar leitura cronológica no diretório versions/ e no git log.
# Exemplo gerado: 2026_05_12_1830-<hash>_initial_mvp0_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Caminhos onde o Alembic procura por scripts e fontes Python.
# Vazio aqui — env.py cuida disso programaticamente.
prepend_sys_path = .

# Timezone para timestamps no nome do arquivo. UTC para alinhar com
# a política do CIRCE (ADR-003 §2.1: timestamps em UTC).
timezone = UTC

# Truncamento do slug no nome do arquivo (caracteres).
truncate_slug_length = 40

# URL do banco: deixada vazia. Injetada em env.py.
sqlalchemy.url =

# Configuração de logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
